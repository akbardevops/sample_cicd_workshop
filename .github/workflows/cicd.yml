name: Deploy application on docker container

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continous Integration
    runs-on: ubuntu-latest

    steps:
     - name: checkout code
       uses: actions/checkout@v4
     
     - name: Run Gitleaks scan
       uses: gitleaks/gitleaks-action@v2
      
     - name: install dependencies
       run: |
         cd ./backend
         npm install
    
     - name: Run lint
       run: |
         cd ./backend
         npm run lint 

     - name: login dockerhub
       uses: docker/login-action@v3
       
       with:
         username: ${{ secrets.DOCKERUSERNAME }}
         password: ${{ secrets.DOCKERPASSWORD }}

     - name: build backend docker image
       run: docker build -t ${{ secrets.DOCKERUSERNAME }}/backend:${{ github.sha }} ./backend
     
     - name: build frontend docker image
       run: docker build -t ${{ secrets.DOCKERUSERNAME }}/frontend:${{ github.sha }} ./frontend

     - name: check the docker images
       run: docker images

     - name: push images to docker hub
       run: |
          docker push ${{ secrets.DOCKERUSERNAME }}/backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERUSERNAME }}/frontend:${{ github.sha }}
  
  cd:
   name: deployed into docker container
   runs-on: ubuntu-latest
   needs: ci
   steps:
     - name: Deploy to server
       uses: appleboy/ssh-action@v1.0.3
       with:
         host: ${{ secrets.SERVERHOST }}
         username: ${{ secrets.SERVER_USER }}
         key: ${{ secrets.SERVER_SSH_KEY }}
         script: |
            docker pull ${{ secrets.DOCKERUSERNAME }}/backend:${{ github.sha }}
            docker pull ${{ secrets.DOCKERUSERNAME }}/frontend:${{ github.sha }}

            docker stop frontend || true
            docker stop backend || true

            docker rm frontend || true
            docker rm backend || true

            docker run -d --name frontend -p 80:80 ${{ secrets.DOCKERUSERNAME }}/backend:${{ github.sha }}
            docker run -d --name backend -p 5000:5000 ${{ secrets.DOCKERUSERNAME }}/frontend:${{ github.sha }}

      

